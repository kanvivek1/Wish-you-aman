<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Surprise for Aman!</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #1a1a2e; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; color: white; }
        #unlock-button { padding: 20px 40px; font-size: 24px; cursor: pointer; background: linear-gradient(45deg, #ff416c, #ff4b2b); border: none; border-radius: 50px; color: white; box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4); transition: transform 0.2s, box-shadow 0.2s; z-index: 10; }
        #unlock-button:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(255, 75, 43, 0.6); }
        #unlock-button:active { transform: scale(0.98); }
        #main-stage { display: none; width: 100%; height: 100%; position: relative; justify-content: center; align-items: center; flex-direction: column; }
        #wish-photo { max-width: 80%; max-height: 80%; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); opacity: 0; transform: scale(0.5); transition: opacity 1s ease-out, transform 0.8s ease-out; }
        #wish-photo.reveal { opacity: 1; transform: scale(1); }
        .bouquet { position: absolute; font-size: 50px; opacity: 0; animation: popUp 1.5s ease-out forwards; z-index: 5; }
        @keyframes popUp { 0% { transform: translateY(50px) scale(0); opacity: 0; } 50% { opacity: 1; transform: translateY(-10px) scale(1.2); } 100% { opacity: 0; transform: translateY(-50px) scale(1); } }
    </style>
</head>
<body>

    <!-- Stage 1: The Lock Button -->
    <button id="unlock-button">Aman, click to unveil your surprise! 🎁</button>

    <!-- Stage 2: The Celebration -->
    <div id="main-stage">
        <img id="wish-photo" src="" alt="Congratulation Wish">
    </div>

    <!-- JS Libraries for Effects -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        const btn = document.getElementById('unlock-button');
        const stage = document.getElementById('main-stage');
        const photo = document.getElementById('wish-photo');

        // Target ImgBB page URL
        const PAGE_URL = "https://ibb.co/PZhgSq2D";

        btn.addEventListener('click', async () => {
            btn.style.display = 'none';
            stage.style.display = 'flex';

            // 1. Fetch real direct image link from ImgBB HTML wrapper using a free proxy
            try {
                const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(PAGE_URL);
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                // Extract real image source from meta tags
                const parser = new DOMParser();
                const doc = parser.parseFromString(data.contents, 'text/html');
                const ogImage = doc.querySelector('meta[property="og:image"]');
                
                if (ogImage && ogImage.content) {
                    photo.src = ogImage.content;
                } else {
                    photo.src = "https://i.ibb.co/PZhgSq2D/image.png"; // Fallback
                }
            } catch (err) {
                photo.src = "https://i.ibb.co/PZhgSq2D/image.png";
            }

            // 2. Celebration Confetti 🎊
            var duration = 5 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) { return Math.random() * (max - min) + min; }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) { return clearInterval(interval); }
                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);

            // 3. Bouquet Bursts 💐
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    const bouquet = document.createElement('div');
                    bouquet.classList.add('bouquet');
                    bouquet.innerHTML = '💐';
                    bouquet.style.left = Math.random() * 80 + 10 + '%';
                    bouquet.style.top = Math.random() * 80 + 10 + '%';
                    stage.appendChild(bouquet);
                    setTimeout(() => bouquet.remove(), 1500);
                }, i * 300);
            }

            // 4. Reveal Image
            setTimeout(() => {
                photo.classList.add('reveal');
            }, 500);
        });
    </script>
</body>
</html>
